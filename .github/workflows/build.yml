name: Build METRA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'metra-android.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract METRA project
        run: unzip metra-android.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: metra-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: METRA-APK
          path: metra-android/app/build/outputs/apk/debug/*.apk
